server {
    listen 80;
    listen [::]:80;
    server_name showkibiotech.com www.showkibiotech.com;
    if ($host = www.showkibiotech.com) { return 308 $scheme://showkibiotech.com$request_uri; }

    root /var/www/showkibiotech/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 9m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2760s; # Translation (30 min maximum) plus static build (15 min).
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/uploads/cms/[0-9a-f-]+\.pdf$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /var/log/nginx/showkibiotech.access.log;
    error_log /var/log/nginx/showkibiotech.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Always load the current admin entry after a deployment. Hashed JS stays immutable.
    location ^~ /admin/ {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /models/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
